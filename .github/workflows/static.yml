name: static

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r icmarkets-fix-api/requirements.txt
      - name: Import check
        env:
          API_KEY: ci-test-key
        run: python -c "import main"
        working-directory: icmarkets-fix-api
